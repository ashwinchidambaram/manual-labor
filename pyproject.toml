[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manuallabor"
version = "0.1.0"
description = "Manual Labor: turn source documents into a reviewed knowledge base."
requires-python = ">=3.12,<3.13"  # Docling, torch and onnxruntime wheels are only validated on 3.12
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "pymupdf>=1.24",
    "docling>=2.0",
    "rapidocr>=3.10",
    "onnxruntime>=1.17",  # the backend rapidocr runs on; rapidocr does not declare it
    "python-docx>=1.1",
    "pillow>=10",
    "imagehash>=4.3",
    "litellm>=1.40",
    "httpx>=0.27",  # imported directly by providers/probe.py
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "jsonschema>=4.22",
    "pyyaml>=6",
    "scipy>=1.11",
    "markdown-it-py>=3",
]

[project.scripts]
labor = "manuallabor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "reportlab>=4.0",  # tests/fixtures/gen only
    "hypothesis>=6",
    "types-pyyaml>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.hatch.build.targets.wheel]
packages = ["manuallabor"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["manuallabor"]

[[tool.mypy.overrides]]
module = [
    "fitz",
    "docling.*",
    "rapidocr",
    "pymupdf",
    "torch",
    "docx.*",
    "imagehash",
    "litellm",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow' --basetemp=.pytest_tmp"
markers = [
    "slow: slow end-to-end tests (deselected by default)",
    "live: needs real local models; runs only with MANUALLABOR_LIVE=1",
    "acc1: SPEC 11.1, the six-fixture round trip (scripts/acceptance.sh AC1)",
    "acc2: SPEC 11.2, scanned-fixture recall (prints a RECALL line)",
    "acc3: SPEC 11.3, figure methods and caption-reference attachment (prints evidence lines)",
    "acc5: SPEC 11.5, agent proposals carry their re-check results (prints a PROPOSALS line)",
]
