[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manuallabor"
version = "0.1.0"
description = "Manual Labor: turn source documents into a reviewed knowledge base."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "pymupdf>=1.24",
    "docling>=2.0",
    "rapidocr>=3.10",
    "rapidocr-onnxruntime>=1.3",
    "python-docx>=1.1",
    "pillow>=10",
    "imagehash>=4.3",
    "cairosvg>=2.7",
    "litellm>=1.40",
    "sentence-transformers>=3.0",
    "reportlab>=4.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "python-multipart>=0.0.9",
    "jsonschema>=4.22",
    "pyyaml>=6",
]

[project.scripts]
labor = "manuallabor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "httpx>=0.27",
    "hypothesis>=6",
    "types-pyyaml>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.hatch.build.targets.wheel]
packages = ["manuallabor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["manuallabor"]

[[tool.mypy.overrides]]
module = [
    "fitz",
    "docling.*",
    "rapidocr_onnxruntime",
    "rapidocr",
    "pymupdf",
    "torch",
    "docx.*",
    "imagehash",
    "cairosvg",
    "litellm",
    "sentence_transformers",
    "sklearn.*",
    "reportlab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: slow end-to-end tests (deselected by default)"]
