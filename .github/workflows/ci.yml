name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check manuallabor/ tests/
      - name: Type check
        run: uv run mypy manuallabor/
      - name: Test
        run: uv run pytest -q
      # Also run after pytest: `uv run labor schemas export --check` verifies that the
      # committed schemas/ match the Pydantic models. The frontend job checks the TS types
      # against those committed schemas, so a stale schema fails there too.
      - name: Schemas up to date
        run: uv run labor schemas export --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Regenerates src/types/generated.ts from schemas/_all.json and fails if it differs
      # from the committed file. Needs only the committed schemas/ directory.
      - name: Generated types are fresh
        run: npm run check-types-fresh
      - run: npm run typecheck
      - run: npm test -- --run
