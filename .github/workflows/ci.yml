name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check manuallabor/ tests/
      - name: Type check
        run: uv run mypy manuallabor/
      - name: Install Tesseract (the OCR engine the test floors are written for)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Test
        run: uv run pytest -q
      # Also run after pytest: `uv run labor schemas export --check` verifies that the
      # committed schemas/ match the Pydantic models. The frontend job checks the TS types
      # against those committed schemas, so a stale schema fails there too.
      - name: Schemas up to date
        run: uv run labor schemas export --check
      # The committed OpenAPI document must match the FastAPI app; the frontend job checks
      # that src/api/types.ts is generated from it.
      - name: OpenAPI up to date
        run: uv run python -m manuallabor.api.export_openapi --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # Regenerates src/types/generated.ts from schemas/_all.json and fails if it differs
      # from the committed file. Needs only the committed schemas/ directory.
      - name: Generated types are fresh
        run: npm run check-types-fresh
      - name: Generated API types are fresh
        run: npm run check-api-fresh
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  # Playwright drives the real UI against `labor serve --mock` on a cached mock project built from
  # tests/fixtures (scripts/e2e-project.sh). Chromium only. Python tests are not run here.
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync Python dependencies
        run: uv sync --all-groups
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Tesseract (OCR for the scanned fixture)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Cache Docling models
        id: docling-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/docling
          key: docling-models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: docling-models-${{ runner.os }}-
      - name: Download Docling models
        if: steps.docling-cache.outputs.cache-hit != 'true'
        run: uv run docling-tools models download
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Cache the e2e mock project
        uses: actions/cache@v4
        with:
          path: frontend/e2e/.cache
          # Same inputs as the key in scripts/e2e-project.sh: fixtures, the script, every Python source (which holds the
          # *ALGO_VERSION constants) and the lock file.
          key: e2e-project-${{ hashFiles('tests/fixtures/CHECKSUMS.json', 'tests/fixtures/project-a/project.json', 'scripts/e2e-project.sh', 'uv.lock', 'manuallabor/**/*.py') }}
      - name: Playwright
        run: npm run e2e
        working-directory: frontend
        env:
          CI: "true"
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
